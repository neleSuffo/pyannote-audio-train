architecture:
  name: pyannote.audio.models.PyanNet
  params:
    cnn:
      kernel_size:
      - 3
      - 3
      - 3
      out_channels:
      - 128
      - 128
      - 64
      stride:
      - 1
      - 1
      - 1
    ff:
      hidden_size:
      - 256
      - 128
    head:
      dropout: 0.3
      hidden_size:
      - 128
      output_size: 5
    pooling:
      name: SelfAttentionPooling
      params:
        attention_channels: 128
    transformer:
      d_model: 256
      dim_feedforward: 512
      dropout: 0.1
      nhead: 8
      num_layers: 4
data_augmentation:
  name: Pipeline
  params:
  - name: AddNoise
    params:
      collection: MUSAN.Collection.BackgroundNoise
      snr_max: 20
      snr_min: 0
  - name: SpecAugment
    params:
      freq_mask: 0.1
      time_mask: 0.1
      time_warping: 0.2
  - name: AddReverb
    params:
      rir_collection: RIR.Noise
feature_extraction:
  name: Pretrained
  params:
    freeze: true
    model: pyannote/wav2vec2-base
    output_layer: 6
    sample_rate: 16000
loss:
  name: BCEWithLogitsLoss
  params:
    weight:
    - 1.0
    - 2.0
    - 1.0
    - 1.0
    - 1.0
scheduler:
  name: CustomScheduler
  params:
    class: CosineAnnealingWithWarmup
    learning_rate: 1e-4
    max_epochs: 50
    min_lr: 1e-6
    module: custom_schedulers
    warmup_epochs: 5
    warmup_start_lr: 1e-6
task:
  name: MultilabelDetection
  params:
    batch_size: 32
    duration: 3.0
    labels_spec:
      regular:
      - KCHI
      - CHI
      - MAL
      - FEM
      - OVH
      union:
        speech:
        - KCHI
        - CHI
        - MAL
        - FEM
        - speech
    per_epoch: 1
