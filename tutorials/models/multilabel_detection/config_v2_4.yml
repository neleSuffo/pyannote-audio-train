architecture:
  name: pyannote.audio.models.PyanNet
  params:
    sincnet:
      kernel_size: [151, 5, 5]
      out_channels: [512, 192, 128]
      instance_normalize: true
    rnn:
      bidirectional: true
      dropout: 0.15
      hidden_size: 320
      num_layers: 2
      unit: GRU
    ff:
      hidden_size: [256, 128]
feature_extraction:
  name: RawAudio
  params:
    sample_rate: 16000
scheduler:
  name: CyclicScheduler
  params:
    epochs_per_cycle: 14
    learning_rate: 0.001
task:
  name: MultilabelDetection
  params:
    batch_size: 32
    duration: 3.0
    labels_spec:
      regular:
      - KCHI
      - CDS
      - OHS
      - SPEECH
    per_epoch: 1