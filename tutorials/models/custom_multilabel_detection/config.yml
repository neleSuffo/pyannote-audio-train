# Task
task:
   name: MultilabelDetection
   params:
      duration: 3.0
      batch_size: 32
      per_epoch: 1
      labels_spec:
        regular: ['kchi', 'och', 'mal', 'fem', 'ovh']
        union:
          speech: ['kchi', 'och', 'mal', 'fem', 'speech']

# Data augmentation
data_augmentation:
   name: Pipeline
   params:
      - name: AddNoise
        params:
           snr_min: 0
           snr_max: 20
           collection: MUSAN.Collection.BackgroundNoise
      - name: SpecAugment
        params:
           time_warping: 0.2
           freq_mask: 0.1
           time_mask: 0.1

# Feature extraction (handled by model)
feature_extraction:
   name: RawAudio
   params:
      sample_rate: 16000

# Custom model
architecture:
   name: custom_model.CustomMultilabelModel
   params:
      hidden_size: 256
      num_transformer_layers: 4
      output_size: 5

# Scheduler
scheduler:
   name: CosineScheduler
   params:
      learning_rate: 1e-4
      warmup_epochs: 5
      max_epochs: 200
      min_lr: 1e-6

# Loss
loss:
   name: BCEWithLogitsLoss
   params:
      weight: [1.0, 2.0, 1.0, 1.0, 1.0]